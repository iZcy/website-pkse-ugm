services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: webapp
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: webapp
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      GOMEMLIMIT: 512MiB
    volumes:
      - ./templates:/app/templates
      - ./webapp-prod:/app/webapp-prod
      - ./static:/app/static
    depends_on:
      mongo:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cache:/var/cache/nginx/uploads
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/admin-ui:/var/www/admin-ui:ro
      - /var/www/rapor-ui:/var/www/rapor-ui:ro
      - /var/www/member-ui:/var/www/member-ui:ro
      - /var/www/login-ui:/var/www/login-ui:ro
      - /var/www/assets:/var/www/assets:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - go-frontend

  wa-service:
    build:
      context: ./wa-service
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - wa-session:/app/wa-session

volumes:
  mongo-data:
  wa-session:
