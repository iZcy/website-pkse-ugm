proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=upload_cache:10m max_size=500m inactive=60d use_temp_path=off;

client_max_body_size 10m;

server {
    listen 80;
    listen 443 ssl;
    server_name pkseugm.web.id www.pkseugm.web.id;

    ssl_certificate     /etc/letsencrypt/live/pkseugm.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkseugm.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/broadcast/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/eksplora/ {
        proxy_pass http://127.0.0.1:5300/;
        proxy_set_header Host $host;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_cache upload_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /rapor/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /rapor/ {
        root /var/www/rapor-ui;
        index index.html;
        try_files $uri /rapor/index.html =404;
    }

    location /member/ {
        root /var/www/member-ui;
        index index.html;
        try_files $uri /member/index.html =404;
    }

    location = /member {
        return 302 /member/;
    }


    location = /admin/logout {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location /admin/ {
        root /var/www/admin-ui;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
