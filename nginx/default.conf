proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=upload_cache:10m max_size=500m inactive=60d use_temp_path=off;

client_max_body_size 10m;

server {
    listen 80;
    listen 443 ssl;
    server_name pkseugm.web.id www.pkseugm.web.id;

    # ACME http-01 challenge. Must stay above the HTTPS redirect and the SPA
    # locations so certbot --webroot can renew without touching nginx itself.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Redirect only when Cloudflare tells us the visitor used plain HTTP.
    # Redirecting unconditionally would loop forever under Cloudflare Flexible SSL.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ssl_certificate     /etc/letsencrypt/live/pkseugm.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkseugm.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/broadcast/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/eksplora/ {
        proxy_pass http://127.0.0.1:5300/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # This upstream calls out to Instagram; fail fast instead of hanging
        # the browser tab for the default 60s.
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_cache upload_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /assets/ {
        root /var/www;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /rapor/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /rapor/ {
        root /var/www/rapor-ui;
        index index.html;
        try_files $uri /rapor/index.html =404;
    }

    location /member/ {
        root /var/www/member-ui;
        index index.html;
        try_files $uri /member/index.html =404;
    }

    location = /member {
        return 302 /member/;
    }

    location /login {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        if ($request_method = POST) {
            proxy_pass http://127.0.0.1:8080;
        }
        root /var/www/login-ui;
        index login/index.html;
        try_files /login/index.html =404;
    }

    location /login/ {
        root /var/www/login-ui;
        index index.html;
        try_files $uri /login/index.html =404;
    }

    location = /admin/logout {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        root /var/www/admin-ui;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
