<!DOCTYPE html>
<html lang="id">
<head>
  {{template "head" .}}
  <title>PKSE UGM | Statistik</title>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
{{template "navbar" .}}

<div class="pt-32 pb-24 px-6 max-w-7xl mx-auto">
  <div class="text-center mb-16">
    <h1 class="text-5xl font-black text-gray-900 mb-6">Metrik Kepengurusan <span class="text-brand-600">Aktif</span></h1>
    <form id="periodForm" class="inline-flex items-center bg-white p-2 rounded-2xl shadow-sm border border-gray-200">
      <span class="px-4 text-xs font-bold text-gray-400 uppercase">Periode</span>
      <select id="periodSelect" name="period" onchange="document.getElementById('periodForm').submit()" class="bg-transparent py-2 px-4 focus:outline-none text-brand-800 font-extrabold cursor-pointer">
        {{range .Periods}}
        <option value="{{.Label}}" {{if eq .Label $.SelectedPeriod}}selected{{end}}>{{.DisplayName}}</option>
        {{end}}
      </select>
    </form>
  </div>

  <div class="bg-white rounded-[3rem] p-12 shadow-lg border border-gray-100">
    {{if eq (len .Stats) 0}}
      <div class="text-center py-12 text-gray-400">Data tidak tersedia untuk periode ini.</div>
    {{else}}
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12">
        {{range .Stats}}
        <div class="text-center">
          <div class="text-6xl font-black text-brand-600 mb-4">{{.Value}}</div>
          <div class="text-sm font-bold text-gray-500 uppercase tracking-widest">{{.Label}}</div>
        </div>
        {{end}}
      </div>
    {{end}}
  </div>
</div>

{{template "footer" .}}
</body>
</html>
