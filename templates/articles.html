<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artikel - PKSE UGM</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
  {{template "navbar" .}}
  <main class="container mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold mb-8">Artikel</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {{range .Articles}}
      <article class="bg-white rounded-lg shadow-md overflow-hidden">
        {{if .CoverURL}}
        <img src="{{.CoverURL}}" alt="{{.Title}}" class="w-full h-48 object-cover"/>
        {{end}}
        <div class="p-6">
          <h2 class="text-xl font-semibold mb-2">
            <a href="/artikel/{{.Slug}}" class="hover:text-blue-600">{{.Title}}</a>
          </h2>
          {{if .Excerpt}}<p class="text-gray-600 text-sm mb-4">{{.Excerpt}}</p>{{end}}
          <a href="/artikel/{{.Slug}}" class="text-blue-600 hover:underline text-sm">Baca selengkapnya &rarr;</a>
        </div>
      </article>
      {{else}}
      <p class="col-span-3 text-gray-500">Belum ada artikel yang dipublikasikan.</p>
      {{end}}
    </div>
  </main>
  {{template "footer" .}}
</body>
</html>
