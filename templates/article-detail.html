<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{.Article.Title}} - PKSE UGM</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
  {{template "navbar" .}}
  <main class="container mx-auto px-4 py-12 max-w-3xl">
    {{if .Article.CoverURL}}
    <img src="{{.Article.CoverURL}}" alt="{{.Article.Title}}" class="w-full h-64 object-cover rounded-lg mb-8"/>
    {{end}}
    <h1 class="text-4xl font-bold mb-4">{{.Article.Title}}</h1>
    {{if .Article.Excerpt}}<p class="text-gray-500 italic mb-6">{{.Article.Excerpt}}</p>{{end}}
    <div class="prose max-w-none text-gray-800 leading-relaxed">
      {{.Article.Content}}
    </div>
    <div class="mt-10">
      <a href="/artikel" class="text-blue-600 hover:underline">&larr; Kembali ke daftar artikel</a>
    </div>
  </main>
  {{template "footer" .}}
</body>
</html>
