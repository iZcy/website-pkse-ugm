<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin – PKSE UGM</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
/* ── layout ── */
.topbar{background:#385F8C;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar h1{font-size:1rem;font-weight:700;letter-spacing:.5px}
.topbar a{color:#fff;opacity:.85;text-decoration:none;font-size:.85rem;display:flex;align-items:center;gap:6px}
.topbar a:hover{opacity:1}
.shell{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;flex-shrink:0;padding:16px 0}
.sidebar button{width:100%;background:none;border:none;text-align:left;padding:10px 20px;cursor:pointer;font-family:inherit;font-size:.9rem;color:#475569;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;transition:.15s}
.sidebar button:hover{background:#f8fafc;color:#385F8C}
.sidebar button.active{color:#385F8C;font-weight:600;border-left-color:#385F8C;background:#eff6ff}
.main{flex:1;padding:28px;max-width:960px}
/* ── card ── */
.card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:22px 24px;margin-bottom:20px}
.card-title{font-size:1rem;font-weight:700;margin-bottom:16px;color:#1e3a5f;display:flex;align-items:center;gap:8px}
/* ── table ── */
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{text-align:left;padding:8px 10px;border-bottom:2px solid #e2e8f0;color:#64748b;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-gray{background:#f1f5f9;color:#64748b}
.badge-blue{background:#dbeafe;color:#1d4ed8}
/* ── buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-family:inherit;font-size:.85rem;font-weight:600;transition:.15s}
.btn-primary{background:#385F8C;color:#fff}.btn-primary:hover{background:#2d4f78}
.btn-danger{background:#fee2e2;color:#dc2626}.btn-danger:hover{background:#fecaca}
.btn-secondary{background:#f1f5f9;color:#475569}.btn-secondary:hover{background:#e2e8f0}
.btn-sm{padding:4px 10px;font-size:.78rem}
/* ── form ── */
.form-row{margin-bottom:14px}
label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:5px}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;font-family:inherit;font-size:.875rem;color:#1e293b;background:#fff;transition:.15s}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{outline:none;border-color:#385F8C;box-shadow:0 0 0 3px rgba(56,95,140,.12)}
textarea{resize:vertical;min-height:90px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toggle-row{display:flex;align-items:center;gap:10px;font-size:.875rem}
input[type=checkbox]{width:16px;height:16px;cursor:pointer}
/* ── inline form panel ── */
.form-panel{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:20px 22px;margin-top:16px;display:none}
.form-panel.open{display:block}
.form-actions{display:flex;gap:10px;margin-top:16px}
/* ── toast ── */
#toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:8px;font-size:.875rem;font-weight:600;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;z-index:999}
#toast.show{opacity:1;transform:translateY(0)}
#toast.err{background:#dc2626}
</style>
</head>
<body>

<div class="topbar">
  <h1><i class="fa fa-shield-halved"></i>&nbsp; Panel Admin – Paguyuban KSE UGM</h1>
  <a href="/admin/logout"><i class="fa fa-right-from-bracket"></i> Keluar</a>
</div>

<div class="shell">
  <nav class="sidebar">
    <button onclick="switchTab('pengumuman')" id="tab-pengumuman"><i class="fa fa-bullhorn fa-fw"></i> Pengumuman</button>
    <button onclick="switchTab('tentang')" id="tab-tentang"><i class="fa fa-circle-info fa-fw"></i> Tentang Kami</button>
    <button onclick="switchTab('departemen')" id="tab-departemen"><i class="fa fa-sitemap fa-fw"></i> Departemen</button>
    <button onclick="switchTab('pengurus')" id="tab-pengurus"><i class="fa fa-users fa-fw"></i> Pengurus</button>
  </nav>

  <main class="main">

    <!-- ═══════════════════════════════════════════════════════ PENGUMUMAN -->
    <div id="pane-pengumuman" class="pane" style="display:none">
      <div class="card">
        <div class="card-title"><i class="fa fa-bullhorn"></i> Daftar Pengumuman</div>
        <button class="btn btn-primary btn-sm" style="margin-bottom:12px" onclick="openAnnForm()"><i class="fa fa-plus"></i> Tambah Pengumuman</button>
        <div id="ann-form-panel" class="form-panel">
          <input type="hidden" id="ann-id">
          <div class="form-row"><label>Judul</label><input type="text" id="ann-title" placeholder="Judul pengumuman"></div>
          <div class="form-row"><label>Isi</label><textarea id="ann-content" rows="5" placeholder="Isi pengumuman..."></textarea></div>
          <div class="form-row toggle-row"><input type="checkbox" id="ann-published"><label for="ann-published" style="margin:0">Publikasikan sekarang</label></div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="saveAnn()"><i class="fa fa-floppy-disk"></i> Simpan</button>
            <button class="btn btn-secondary" onclick="closeAnnForm()">Batal</button>
          </div>
        </div>
        <table id="ann-table">
          <thead><tr><th>Judul</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead>
          <tbody id="ann-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ TENTANG KAMI -->
    <div id="pane-tentang" class="pane" style="display:none">
      <div class="card">
        <div class="card-title"><i class="fa fa-circle-info"></i> Tentang Kami</div>
        <div class="form-row"><label>Sejarah</label><textarea id="ts-sejarah" rows="6" placeholder="Narasi sejarah organisasi..."></textarea></div>
        <div class="form-row"><label>Visi</label><textarea id="ts-visi" rows="3" placeholder="Pernyataan visi..."></textarea></div>
        <div class="form-row"><label>Misi <span style="font-weight:400;color:#94a3b8">(satu poin per baris)</span></label><textarea id="ts-misi" rows="5" placeholder="Misi 1&#10;Misi 2&#10;Misi 3"></textarea></div>
      </div>
      <div class="card">
        <div class="card-title"><i class="fa fa-chart-bar"></i> Statistik</div>
        <div class="grid-2">
          <div class="form-row"><label>Jumlah Anggota</label><input type="text" id="ts-stat-members" placeholder="cth: 500+"></div>
          <div class="form-row"><label>Jumlah Departemen</label><input type="text" id="ts-stat-dept" placeholder="cth: 8"></div>
          <div class="form-row"><label>Jumlah Program Kerja</label><input type="text" id="ts-stat-proker" placeholder="cth: 24"></div>
        </div>
        <button class="btn btn-primary" onclick="saveSiteSetting()"><i class="fa fa-floppy-disk"></i> Simpan Semua</button>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ DEPARTEMEN -->
    <div id="pane-departemen" class="pane" style="display:none">
      <div class="card">
        <div class="card-title"><i class="fa fa-sitemap"></i> Daftar Departemen</div>
        <button class="btn btn-primary btn-sm" style="margin-bottom:12px" onclick="openDeptForm()"><i class="fa fa-plus"></i> Tambah Departemen</button>
        <div id="dept-form-panel" class="form-panel">
          <input type="hidden" id="dept-id">
          <div class="grid-2">
            <div class="form-row"><label>Nama Departemen</label><input type="text" id="dept-name" placeholder="cth: Departemen PSDM"></div>
            <div class="form-row"><label>Ikon (Font Awesome)</label><input type="text" id="dept-icon" placeholder="cth: fa-users"></div>
          </div>
          <div class="form-row"><label>Deskripsi</label><textarea id="dept-desc" rows="3" placeholder="Deskripsi singkat departemen..."></textarea></div>
          <div class="form-row"><label>Urutan Tampil</label><input type="number" id="dept-order" placeholder="1" min="0"></div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="saveDept()"><i class="fa fa-floppy-disk"></i> Simpan</button>
            <button class="btn btn-secondary" onclick="closeDeptForm()">Batal</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Nama</th><th>Ikon</th><th>Urutan</th><th>Aksi</th></tr></thead>
          <tbody id="dept-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ PENGURUS -->
    <div id="pane-pengurus" class="pane" style="display:none">
      <div class="card">
        <div class="card-title"><i class="fa fa-users"></i> Daftar Pengurus</div>
        <button class="btn btn-primary btn-sm" style="margin-bottom:12px" onclick="openOfficerForm()"><i class="fa fa-plus"></i> Tambah Pengurus</button>
        <div id="officer-form-panel" class="form-panel">
          <input type="hidden" id="off-id">
          <div class="grid-2">
            <div class="form-row"><label>Nama Lengkap</label><input type="text" id="off-name" placeholder="Nama pengurus"></div>
            <div class="form-row"><label>Jabatan</label><input type="text" id="off-role" placeholder="cth: Ketua Umum"></div>
          </div>
          <div class="grid-2">
            <div class="form-row">
              <label>Tingkat</label>
              <select id="off-tier">
                <option value="inti">Pengurus Inti</option>
                <option value="departemen">Pengurus Departemen</option>
              </select>
            </div>
            <div class="form-row"><label>Departemen</label><input type="text" id="off-dept" placeholder="Kosongkan jika pengurus inti"></div>
          </div>
          <div class="grid-2">
            <div class="form-row"><label>URL Foto</label><input type="text" id="off-photo" placeholder="https://..."></div>
            <div class="form-row"><label>Urutan Tampil</label><input type="number" id="off-order" placeholder="1" min="0"></div>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" onclick="saveOfficer()"><i class="fa fa-floppy-disk"></i> Simpan</button>
            <button class="btn btn-secondary" onclick="closeOfficerForm()">Batal</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Nama</th><th>Jabatan</th><th>Tingkat</th><th>Urutan</th><th>Aksi</th></tr></thead>
          <tbody id="officer-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<div id="toast"></div>

<script>
// ── tab navigation ────────────────────────────────────────────────────────────
const TABS = ['pengumuman','tentang','departemen','pengurus'];
function switchTab(name) {
  TABS.forEach(t => {
    document.getElementById('pane-'+t).style.display = (t===name)?'block':'none';
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
  });
  if(name==='pengumuman') loadAnn();
  if(name==='tentang')    loadSiteSetting();
  if(name==='departemen') loadDept();
  if(name==='pengurus')   loadOfficers();
}

// ── toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (err?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.className='', 3000);
}

// ── generic API helpers ───────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

// ═══════════════════════════════════════════════════════════════ PENGUMUMAN
async function loadAnn() {
  const items = await api('GET','/api/cms/announcements');
  const tb = document.getElementById('ann-tbody');
  if(!items.length){ tb.innerHTML='<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px">Belum ada pengumuman</td></tr>'; return; }
  tb.innerHTML = items.map(a=>`
    <tr>
      <td>${esc(a.title)}</td>
      <td>${a.published?'<span class="badge badge-green">Dipublikasi</span>':'<span class="badge badge-gray">Draf</span>'}</td>
      <td>${fmtDate(a.created_at)}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="editAnn(${JSON.stringify(a).replace(/"/g,'&quot;')})"><i class="fa fa-pen"></i></button>
        <button class="btn btn-danger btn-sm" onclick="delAnn('${a.id}')"><i class="fa fa-trash"></i></button>
      </td>
    </tr>`).join('');
}

function openAnnForm(){ document.getElementById('ann-id').value=''; document.getElementById('ann-title').value=''; document.getElementById('ann-content').value=''; document.getElementById('ann-published').checked=false; document.getElementById('ann-form-panel').classList.add('open'); }
function closeAnnForm(){ document.getElementById('ann-form-panel').classList.remove('open'); }

function editAnn(a){
  document.getElementById('ann-id').value=a.id;
  document.getElementById('ann-title').value=a.title;
  document.getElementById('ann-content').value=a.content;
  document.getElementById('ann-published').checked=a.published;
  document.getElementById('ann-form-panel').classList.add('open');
  document.getElementById('ann-form-panel').scrollIntoView({behavior:'smooth'});
}

async function saveAnn(){
  const id = document.getElementById('ann-id').value;
  const body = {
    title:     document.getElementById('ann-title').value.trim(),
    content:   document.getElementById('ann-content').value.trim(),
    published: document.getElementById('ann-published').checked,
  };
  if(!body.title){ toast('Judul tidak boleh kosong',true); return; }
  try {
    if(id) await api('PUT',`/api/cms/announcements/${id}`,body);
    else   await api('POST','/api/cms/announcements',body);
    toast(id?'Pengumuman diperbarui':'Pengumuman ditambahkan');
    closeAnnForm(); loadAnn();
  } catch(e){ toast(e.message,true); }
}

async function delAnn(id){
  if(!confirm('Hapus pengumuman ini?')) return;
  try { await api('DELETE',`/api/cms/announcements/${id}`); toast('Pengumuman dihapus'); loadAnn(); }
  catch(e){ toast(e.message,true); }
}

// ═══════════════════════════════════════════════════════════════ TENTANG KAMI
async function loadSiteSetting(){
  try {
    const ss = await api('GET','/api/cms/site-setting');
    document.getElementById('ts-sejarah').value = ss.sejarah||'';
    document.getElementById('ts-visi').value    = ss.visi||'';
    document.getElementById('ts-misi').value    = (ss.misi||[]).join('\n');
    document.getElementById('ts-stat-members').value = ss.stat_members||'';
    document.getElementById('ts-stat-dept').value    = ss.stat_dept||'';
    document.getElementById('ts-stat-proker').value  = ss.stat_proker||'';
  } catch(e){ toast(e.message,true); }
}

async function saveSiteSetting(){
  const misiRaw = document.getElementById('ts-misi').value;
  const misi = misiRaw.split('\n').map(s=>s.trim()).filter(Boolean);
  const body = {
    sejarah:      document.getElementById('ts-sejarah').value.trim(),
    visi:         document.getElementById('ts-visi').value.trim(),
    misi,
    stat_members: document.getElementById('ts-stat-members').value.trim(),
    stat_dept:    document.getElementById('ts-stat-dept').value.trim(),
    stat_proker:  document.getElementById('ts-stat-proker').value.trim(),
  };
  try { await api('PUT','/api/cms/site-setting',body); toast('Tentang Kami disimpan'); }
  catch(e){ toast(e.message,true); }
}

// ═══════════════════════════════════════════════════════════════ DEPARTEMEN
async function loadDept(){
  const items = await api('GET','/api/cms/departments');
  const tb = document.getElementById('dept-tbody');
  if(!items.length){ tb.innerHTML='<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px">Belum ada departemen</td></tr>'; return; }
  tb.innerHTML = items.map(d=>`
    <tr>
      <td>${esc(d.name)}</td>
      <td><i class="fa ${esc(d.icon_class)} fa-fw"></i> <code style="font-size:.78rem">${esc(d.icon_class)}</code></td>
      <td>${d.sort_order}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="editDept(${JSON.stringify(d).replace(/"/g,'&quot;')})"><i class="fa fa-pen"></i></button>
        <button class="btn btn-danger btn-sm" onclick="delDept('${d.id}')"><i class="fa fa-trash"></i></button>
      </td>
    </tr>`).join('');
}

function openDeptForm(){ ['dept-id','dept-name','dept-icon','dept-desc','dept-order'].forEach(id=>document.getElementById(id).value=''); document.getElementById('dept-form-panel').classList.add('open'); }
function closeDeptForm(){ document.getElementById('dept-form-panel').classList.remove('open'); }

function editDept(d){
  document.getElementById('dept-id').value   = d.id;
  document.getElementById('dept-name').value = d.name;
  document.getElementById('dept-icon').value = d.icon_class;
  document.getElementById('dept-desc').value = d.description;
  document.getElementById('dept-order').value= d.sort_order;
  document.getElementById('dept-form-panel').classList.add('open');
  document.getElementById('dept-form-panel').scrollIntoView({behavior:'smooth'});
}

async function saveDept(){
  const id = document.getElementById('dept-id').value;
  const body = {
    name:        document.getElementById('dept-name').value.trim(),
    icon_class:  document.getElementById('dept-icon').value.trim(),
    description: document.getElementById('dept-desc').value.trim(),
    sort_order:  parseInt(document.getElementById('dept-order').value)||0,
  };
  if(!body.name){ toast('Nama departemen tidak boleh kosong',true); return; }
  try {
    if(id) await api('PUT',`/api/cms/departments/${id}`,body);
    else   await api('POST','/api/cms/departments',body);
    toast(id?'Departemen diperbarui':'Departemen ditambahkan');
    closeDeptForm(); loadDept();
  } catch(e){ toast(e.message,true); }
}

async function delDept(id){
  if(!confirm('Hapus departemen ini?')) return;
  try { await api('DELETE',`/api/cms/departments/${id}`); toast('Departemen dihapus'); loadDept(); }
  catch(e){ toast(e.message,true); }
}

// ═══════════════════════════════════════════════════════════════ PENGURUS
async function loadOfficers(){
  const items = await api('GET','/api/cms/officers');
  const tb = document.getElementById('officer-tbody');
  if(!items.length){ tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px">Belum ada pengurus</td></tr>'; return; }
  tb.innerHTML = items.map(o=>`
    <tr>
      <td>${esc(o.name)}</td>
      <td>${esc(o.role)}</td>
      <td>${o.tier==='inti'?'<span class="badge badge-blue">Inti</span>':'<span class="badge badge-gray">Departemen</span>'}</td>
      <td>${o.sort_order}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="editOfficer(${JSON.stringify(o).replace(/"/g,'&quot;')})"><i class="fa fa-pen"></i></button>
        <button class="btn btn-danger btn-sm" onclick="delOfficer('${o.id}')"><i class="fa fa-trash"></i></button>
      </td>
    </tr>`).join('');
}

function openOfficerForm(){ ['off-id','off-name','off-role','off-dept','off-photo','off-order'].forEach(id=>document.getElementById(id).value=''); document.getElementById('off-tier').value='inti'; document.getElementById('officer-form-panel').classList.add('open'); }
function closeOfficerForm(){ document.getElementById('officer-form-panel').classList.remove('open'); }

function editOfficer(o){
  document.getElementById('off-id').value    = o.id;
  document.getElementById('off-name').value  = o.name;
  document.getElementById('off-role').value  = o.role;
  document.getElementById('off-tier').value  = o.tier;
  document.getElementById('off-dept').value  = o.department;
  document.getElementById('off-photo').value = o.photo_url;
  document.getElementById('off-order').value = o.sort_order;
  document.getElementById('officer-form-panel').classList.add('open');
  document.getElementById('officer-form-panel').scrollIntoView({behavior:'smooth'});
}

async function saveOfficer(){
  const id = document.getElementById('off-id').value;
  const body = {
    name:       document.getElementById('off-name').value.trim(),
    role:       document.getElementById('off-role').value.trim(),
    tier:       document.getElementById('off-tier').value,
    department: document.getElementById('off-dept').value.trim(),
    photo_url:  document.getElementById('off-photo').value.trim(),
    sort_order: parseInt(document.getElementById('off-order').value)||0,
  };
  if(!body.name){ toast('Nama tidak boleh kosong',true); return; }
  try {
    if(id) await api('PUT',`/api/cms/officers/${id}`,body);
    else   await api('POST','/api/cms/officers',body);
    toast(id?'Pengurus diperbarui':'Pengurus ditambahkan');
    closeOfficerForm(); loadOfficers();
  } catch(e){ toast(e.message,true); }
}

async function delOfficer(id){
  if(!confirm('Hapus pengurus ini?')) return;
  try { await api('DELETE',`/api/cms/officers/${id}`); toast('Pengurus dihapus'); loadOfficers(); }
  catch(e){ toast(e.message,true); }
}

// ── helpers ───────────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s){ if(!s) return '-'; try{ return new Date(s).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }catch{ return s; } }

// ── init ──────────────────────────────────────────────────────────────────────
switchTab('{{.Tab}}');
</script>
</body>
</html>
