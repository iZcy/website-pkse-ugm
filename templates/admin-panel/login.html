<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Panel Admin KSE UGM</title>
<style>
  @font-face { font-family:'Plus Jakarta Sans'; src:url('/static/fonts/PlusJakartaSans-VariableFont_wght.ttf') format('truetype'); font-weight:200 800; }
  *,*::before,*::after { box-sizing:border-box; font-family:'Plus Jakarta Sans',system-ui,sans-serif; margin:0; padding:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f0f4f9; }
  .card { background:#fff; border-radius:20px; padding:40px 36px; width:100%; max-width:380px; box-shadow:0 8px 40px rgba(56,95,140,0.12); }
  .logo { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .logo-dot { width:38px; height:38px; background:#385F8C; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .logo-dot span { color:#fff; font-weight:800; font-size:14px; }
  .logo-text h1 { font-size:14px; font-weight:800; color:#385F8C; line-height:1.2; }
  .logo-text p { font-size:10px; color:#9ca3af; font-weight:600; letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  h2 { font-size:22px; font-weight:800; color:#111; margin-bottom:6px; }
  .subtitle { font-size:13px; color:#6b7280; margin-bottom:28px; }
  label { display:block; font-size:11px; font-weight:700; color:#374151; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  input[type=password] { width:100%; padding:11px 14px; border:2px solid #e5e7eb; border-radius:10px; font-size:14px; outline:none; transition:border-color .15s; background:#f9fafb; }
  input[type=password]:focus { border-color:#385F8C; background:#fff; }
  .btn { width:100%; margin-top:20px; padding:13px; background:#385F8C; color:#fff; font-size:14px; font-weight:700; border:none; border-radius:10px; cursor:pointer; transition:background .15s; }
  .btn:hover { background:#2c4d73; }
  .err { background:#fef2f2; border:1px solid #fecaca; color:#dc2626; font-size:13px; padding:10px 14px; border-radius:10px; margin-bottom:18px; }
  .back { text-align:center; margin-top:18px; font-size:12px; color:#9ca3af; }
  .back a { color:#385F8C; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-dot"><span>KSE</span></div>
    <div class="logo-text">
      <h1>Panel Admin</h1>
      <p>Paguyuban KSE UGM</p>
    </div>
  </div>
  <h2>Masuk</h2>
  <p class="subtitle">Masukkan kata sandi untuk mengakses panel pengelolaan konten.</p>

  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}

  <form method="POST" action="/admin">
    <label for="pw">Kata Sandi</label>
    <input type="password" id="pw" name="password" placeholder="••••••••" autofocus required>
    <button class="btn" type="submit">Masuk →</button>
  </form>
  <div class="back"><a href="/">← Kembali ke website</a></div>
</div>
</body>
</html>
