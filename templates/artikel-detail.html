<!DOCTYPE html>
<html lang="id">
<head>
  {{template "head" .}}
  <title>{{.Article.Title}} | PKSE UGM</title>
</head>
<body class="bg-white text-gray-900 antialiased">
{{template "navbar" .}}

<div class="max-w-4xl mx-auto px-6 pt-32 pb-12">
  <a href="/artikel" class="inline-flex items-center gap-2 text-brand-600 hover:text-brand-800 font-bold text-sm mb-8 transition-colors">
    <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Artikel
  </a>
  
  <div class="flex items-center gap-4 mb-6">
    <span class="px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 font-bold text-xs uppercase tracking-wider"><i data-lucide="calendar" class="w-3 h-3 inline mr-1"></i> {{.Article.CreatedAt.Format "02 Jan 2006"}}</span>
  </div>
  
  <h1 class="text-4xl md:text-6xl font-black text-gray-900 leading-tight mb-8">{{.Article.Title}}</h1>
</div>

{{if .Article.CoverURL}}
<div class="max-w-6xl mx-auto px-6 mb-16">
  <div class="rounded-[2rem] md:rounded-[3rem] overflow-hidden bg-gray-100 shadow-xl border border-gray-200 aspect-video md:aspect-[21/9]">
    <img src="{{.Article.CoverURL}}" alt="Cover" class="w-full h-full object-cover">
  </div>
</div>
{{end}}

<div class="max-w-3xl mx-auto px-6 pb-32">
  <article class="prose prose-lg prose-brand max-w-none text-gray-700 leading-relaxed">
    {{safeHTML .Article.Content}}
  </article>
  
  <div class="mt-16 pt-8 border-t border-gray-200 text-center">
    <p class="text-gray-500 font-medium">Bagikan artikel ini</p>
    <div class="flex justify-center gap-4 mt-4">
      <button class="w-12 h-12 rounded-full bg-brand-50 text-brand-600 hover:bg-brand-600 hover:text-white flex items-center justify-center transition-colors"><i data-lucide="twitter" class="w-5 h-5"></i></button>
      <button class="w-12 h-12 rounded-full bg-brand-50 text-brand-600 hover:bg-brand-600 hover:text-white flex items-center justify-center transition-colors"><i data-lucide="facebook" class="w-5 h-5"></i></button>
      <button class="w-12 h-12 rounded-full bg-brand-50 text-brand-600 hover:bg-brand-600 hover:text-white flex items-center justify-center transition-colors"><i data-lucide="link" class="w-5 h-5"></i></button>
    </div>
  </div>
</div>

{{template "footer" .}}
</body>
</html>
