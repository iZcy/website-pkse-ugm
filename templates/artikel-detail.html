<!DOCTYPE html>
<html lang="id">
<head>
  {{template "head" .}}
  <title>{{.Article.Title}} | PKSE UGM</title>
</head>
<body class="bg-white text-gray-900 antialiased">
{{template "navbar" .}}

<div class="max-w-4xl mx-auto px-6 pt-32 pb-12">
  <a href="/artikel" class="inline-flex items-center gap-2 text-brand-600 hover:text-brand-800 font-bold text-sm mb-8 transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg> Kembali ke Artikel
  </a>

  <div class="flex items-center gap-4 mb-6">
    <span class="px-4 py-1.5 rounded-full bg-gray-100 text-gray-600 font-bold text-xs uppercase tracking-wider"><svg class="w-3 h-3 inline mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> {{.Article.CreatedAt.Format "02 Jan 2006"}}</span>
  </div>

  <h1 class="text-4xl md:text-6xl font-black text-gray-900 leading-tight mb-8">{{.Article.Title}}</h1>
</div>

{{if .Article.CoverURL}}
<div class="max-w-6xl mx-auto px-6 mb-16">
  <div class="rounded-[2rem] md:rounded-[3rem] overflow-hidden bg-gray-100 shadow-xl border border-gray-200 aspect-video md:aspect-[21/9]">
    <img src="{{.Article.CoverURL}}" alt="Cover" class="w-full h-full object-cover">
  </div>
</div>
{{end}}

<div class="max-w-3xl mx-auto px-6 pb-32">
  <article class="prose prose-lg prose-brand max-w-none text-gray-700 leading-relaxed">
    {{safeHTML .Article.Content}}
  </article>

  <div class="mt-16 pt-8 border-t border-gray-200 text-center">
    <p class="text-gray-500 font-medium mb-4">Bagikan artikel ini</p>
    <div class="flex justify-center gap-3">
      <button onclick="window.open('https://wa.me/?text=' + encodeURIComponent(document.title + ' ' + window.location.href), '_blank')" class="w-12 h-12 rounded-full bg-green-50 text-green-600 hover:bg-green-600 hover:text-white flex items-center justify-center transition-colors" title="WhatsApp">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </button>
      <button onclick="window.open('https://twitter.com/intent/tweet?url=' + encodeURIComponent(window.location.href) + '&text=' + encodeURIComponent(document.title), '_blank')" class="w-12 h-12 rounded-full bg-gray-100 text-gray-700 hover:bg-black hover:text-white flex items-center justify-center transition-colors" title="X / Twitter">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </button>
      <button onclick="window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(window.location.href), '_blank')" class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white flex items-center justify-center transition-colors" title="Facebook">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      </button>
      <button id="copyLinkBtn" class="w-12 h-12 rounded-full bg-brand-50 text-brand-600 hover:bg-brand-600 hover:text-white flex items-center justify-center transition-colors relative" title="Salin Link">
        <svg id="copyLinkIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
        <svg id="copyCheckIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        <span id="copyTooltip" class="absolute -top-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 transition-opacity pointer-events-none">Link disalin!</span>
      </button>
    </div>
  </div>
</div>

<script>
document.getElementById('copyLinkBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(window.location.href).then(function() {
    var linkIcon = document.getElementById('copyLinkIcon');
    var checkIcon = document.getElementById('copyCheckIcon');
    var tooltip = document.getElementById('copyTooltip');
    linkIcon.classList.add('hidden');
    checkIcon.classList.remove('hidden');
    tooltip.style.opacity = '1';
    setTimeout(function() {
      linkIcon.classList.remove('hidden');
      checkIcon.classList.add('hidden');
      tooltip.style.opacity = '0';
    }, 2000);
  });
});
</script>

{{template "footer" .}}
</body>
</html>
