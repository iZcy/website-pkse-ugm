{{define "faq.html"}}
<!DOCTYPE html>
<html lang="id">
<head>
{{template "head" .}}
<title>FAQ Beasiswa - PKSE UGM</title>
</head>
<body class="bg-gray-50 text-gray-800">
{{template "navbar" .}}
<main class="container mx-auto px-4 py-8 mt-24 max-w-4xl">
<h1 class="text-4xl font-bold mb-8 w-full text-center text-primary">Tanya Jawab (FAQ)</h1>

<div class="mb-8 flex justify-center">
  <form id="periodForm" class="flex items-center space-x-3 bg-white p-3 rounded-xl shadow-sm border border-gray-100">
    <label for="periodSelect" class="text-sm font-medium text-gray-600">Pilih Periode:</label>
    <div class="relative">
      <select id="periodSelect" name="period" onchange="document.getElementById('periodForm').submit()" class="appearance-none bg-gray-50 border border-gray-200 text-gray-800 py-2 pl-4 pr-10 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer font-medium">
        {{range .Periods}}
        <option value="{{.Label}}" {{if eq .Label $.SelectedPeriod}}selected{{end}}>{{.DisplayName}}</option>
        {{end}}
      </select>
    </div>
  </form>
</div>

{{if eq (len .FAQs) 0}}
  <div class="text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm">
    <p class="text-gray-500">Belum ada FAQ yang ditambahkan pada periode ini.</p>
  </div>
{{else}}
  <div class="space-y-4">
    {{range .FAQs}}
    <details class="group bg-white rounded-2xl border border-gray-100 shadow-sm p-6 [&_summary::-webkit-details-marker]:hidden">
      <summary class="flex justify-between items-center font-bold cursor-pointer list-none text-lg text-gray-800">
        <span>{{.Question}}</span>
        <span class="transition group-open:rotate-180">
          <svg fill="none" height="24" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
        </span>
      </summary>
      <div class="text-gray-600 mt-4 leading-relaxed whitespace-pre-wrap">{{.Answer}}</div>
    </details>
    {{end}}
  </div>
{{end}}
</main>
{{template "footer" .}}
</body>
</html>
{{end}}
