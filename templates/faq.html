<!DOCTYPE html>
<html lang="id">
<head>
  {{template "head" .}}
  <title>PKSE UGM | FAQ Beasiswa</title>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
{{template "navbar" .}}

<div class="pt-32 pb-24 px-6 max-w-4xl mx-auto">
  <div class="text-center mb-12">
    <h1 class="text-5xl font-black text-gray-900 mb-4">Pusat Bantuan & <span class="text-brand-600">FAQ</span></h1>
    <p class="text-gray-500 text-lg">Pertanyaan yang sering diajukan terkait beasiswa KSE.</p>
  </div>

  <form id="periodForm" class="flex justify-center mb-12">
     <div class="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 flex items-center">
      <span class="px-3 text-xs font-bold text-gray-400 uppercase">Periode</span>
      <select id="periodSelect" name="period" onchange="document.getElementById('periodForm').submit()" class="appearance-none bg-transparent py-2 pl-3 pr-8 focus:outline-none text-brand-600 font-bold cursor-pointer">
        {{range .Periods}}
        <option value="{{.Label}}" {{if eq .Label $.SelectedPeriod}}selected{{end}}>{{.DisplayName}}</option>
        {{end}}
      </select>
     </div>
  </form>

  <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100" x-data="{ active: null }">
    {{if eq (len .FAQs) 0}}
      <div class="text-center text-gray-400 py-8">Belum ada FAQ.</div>
    {{else}}
      <div class="space-y-4">
        {{range $index, $faq := .FAQs}}
        <div class="border border-gray-100 rounded-2xl overflow-hidden transition-all" :class="active === {{$index}} ? 'bg-brand-50 border-brand-200' : 'bg-white'">
          <button @click="active !== {{$index}} ? active = {{$index}} : active = null" class="w-full text-left px-6 py-5 flex items-center justify-between font-bold text-gray-800">
            <span>{{.Question}}</span>
            <i data-lucide="chevron-down" class="w-4 h-4 transition-transform" :class="active === {{$index}} ? 'rotate-180 text-brand-600' : 'text-gray-400'"></i>
          </button>
          <div x-show="active === {{$index}}" x-collapse>
            <div class="px-6 pb-6 pt-2 text-gray-600">{{.Answer}}</div>
          </div>
        </div>
        {{end}}
      </div>
    {{end}}
  </div>
</div>

{{template "footer" .}}
</body>
</html>
