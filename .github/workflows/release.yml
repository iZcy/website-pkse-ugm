name: Build & Publish

# Versioning contract:
#   git tag v1.4.0-rc1  ->  :v1.4.0-rc1 and :dev     -> dev box updates itself
#   GitHub Release      ->  :v1.4.0    and :latest   -> prod updates itself
#
# There is no deploy step: Watchtower on the server polls GHCR and pulls the
# moving tag its containers track. CI's only job is to publish good images.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "moving=latest" >> "$GITHUB_OUTPUT"
            echo "channel=prod"  >> "$GITHUB_OUTPUT"
          else
            echo "moving=dev" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE_BASE }}/api:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}/api:${{ steps.meta.outputs.moving }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/web:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}/web:${{ steps.meta.outputs.moving }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published \`${{ steps.meta.outputs.version }}\` to **${{ steps.meta.outputs.channel }}**"
            echo ""
            echo "Moving tag \`:${{ steps.meta.outputs.moving }}\` now points at this build."
            echo "Watchtower polls every 5 minutes; confirm with \`curl https://pkseugm.web.id/healthz\`."
          } >> "$GITHUB_STEP_SUMMARY"
