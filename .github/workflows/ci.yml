name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: true }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... 2>&1 | tee /dev/stderr

  ui:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: admin-ui }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: admin-ui/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint --if-present
