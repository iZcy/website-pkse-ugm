# Production stack. Images are built by GitHub Actions and pushed to GHCR;
# Watchtower pulls them here. Nothing is compiled on this host any more, which
# is what stops the build cache from filling the disk the way it used to.
#
# Containers track a MOVING tag on purpose:
#   prod -> :latest  (moved by publishing a GitHub Release)
#   dev  -> :dev     (moved by pushing a v* tag)
# Pinning an immutable :v1.2.3 here would freeze Watchtower forever, since that
# digest never changes. The immutable tag still exists in the registry for
# rollbacks, and /healthz reports which build is actually running.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: webapp
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # deliberately NOT watchtower-enabled: never auto-restart the database

  go-frontend:
    image: ghcr.io/izcy/website-pkse-ugm/api:${CHANNEL:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: webapp
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      GOMEMLIMIT: 512MiB
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "pkse"

  nginx:
    image: ghcr.io/izcy/website-pkse-ugm/web:${CHANNEL:-latest}
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/cache:/var/cache/nginx/uploads
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - go-frontend
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "pkse"

  wa-service:
    build:
      context: ./wa-service
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - wa-session:/app/wa-session
    # locally built, not published to GHCR, so nothing for Watchtower to poll

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    labels:
      # A scoped watchtower must label itself with the same scope.
      com.centurylinklabs.watchtower.scope: "pkse"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR credentials, only needed while the packages are private
      - ${DOCKER_CONFIG_FILE:-/home/pkseugm/.docker/config.json}:/config.json:ro
    environment:
      DOCKER_CONFIG: /
      # Only touch containers that opted in above — never mongo.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Confine this instance to the PKSE stack. eksplorazcy-service carries a
      # watchtower.enable label from the KreaZcy project but is built locally
      # with no registry behind it, so an unscoped watchtower repeatedly tries
      # to pull it from Docker Hub - which fails, and would silently pull a
      # stranger image if that name were ever published there.
      WATCHTOWER_SCOPE: "pkse"
      # Delete the superseded image after each update. This is the setting that
      # keeps the host free of the dangling-layer debris we cleared out.
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_REMOVE_VOLUMES: "false"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_TIMEOUT: "60s"
      TZ: Asia/Jakarta

volumes:
  mongo-data:
  wa-session:
